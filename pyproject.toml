[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapely-python"
version = "0.1.34"
description = "Scrapely Python SDK - A toolkit for building Actors on the Scrapely platform"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
authors = [
    {name = "Scrapely", email = "support@scrape.ly"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["scraping", "actor", "serverless", "scrapely"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "crawlee>=1.8.0,<2.0.0",
    "websockets>=12.0",
    "scrapely-client-python>=1.0.2,<2",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "playwright>=1.40.0",
    "browserforge>=1.2.0",
]


[project.urls]
Homepage = "https://scrape.ly"
Documentation = "https://scrape.ly/docs/sdk-python"
Repository = "https://github.com/scrapely-app/scrapely-python"
Issues = "https://github.com/scrapely-app/scrapely-python/issues"
Changelog = "https://github.com/scrapely-app/scrapely-python/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrapely = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]